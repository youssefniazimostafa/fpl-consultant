name: Update FPL data and publish site

on:
  # Keep the site fresh through the day -- prices, injury news and odds all
  # change between deadlines. Also runs once right after every deadline
  # passes (FPL deadlines are always :30 past the hour, mostly Fri/Sat
  # evenings and Sun/Mon) so the verdict reflects this week's picks fast.
  schedule:
    - cron: "0 */3 * * *"
    # Pre-deadline snapshot: hourly, but the `gate` job below lets it run
    # the full pipeline only once per deadline, 1-2 hours before it (see
    # .github/scripts/deadline_gate.py); every other hourly run ends in
    # seconds as a success without deploying or committing. Minute 45 puts
    # FPL's :00 and :30 deadlines in the middle of the window even when
    # GitHub starts the run late.
    - cron: "45 * * * *"
    # (2026-11-14: no scheduled run had started since 04:14 UTC; this
    # comment-only change re-registers the schedule.)
  # Settings -> Actions -> "Run workflow" button, for a manual run.
  # Also the backup for the hourly pre-deadline cron: an external scheduler
  # calls this with pre_deadline_check=true at :45 every hour (GitHub's own
  # cron is often late or skipped), and that call goes through the same
  # gate as the "45 * * * *" schedule. A manual run without the input is a
  # full run, as before.
  workflow_dispatch:
    inputs:
      pre_deadline_check:
        description: "Only run if a pre-deadline snapshot is due (used by the external hourly trigger)"
        type: boolean
        required: false
        default: false
  # Catch breakage immediately when fpl/ changes, before the next scheduled run.
  push:
    branches: [main]
    paths:
      - "fpl/**"
      - "site/**"
      - "config.json"
      - ".github/workflows/update.yml"
      - ".github/scripts/**"

# contents: write so the prediction-log commit below can push; pages/id-token
# write are what actions/deploy-pages needs to publish the artifact.
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Cheap check first (standard library only, no uv sync). Regular
  # scheduled runs, pushes and manual runs always pass; the hourly
  # pre-deadline cron passes only for the one snapshot run per deadline.
  gate:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest is moving to 26.04
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - name: Decide whether to run the full pipeline
        id: gate
        run: |
          gated=false
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "45 * * * *" ]; then gated=true; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.pre_deadline_check }}" = "true" ]; then gated=true; fi
          if [ "$gated" != "true" ]; then
            echo "Not the hourly pre-deadline check -- full run."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin main:refs/remotes/origin/main
          python3 .github/scripts/deadline_gate.py

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest is moving to 26.04
    # One full run at a time -- two overlapping runs would both try to
    # commit/push data/predictions and deploy Pages concurrently. Set on
    # this job (not the workflow) so the quick hourly gate runs never hold
    # or cancel a queued full run.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # A run that waited behind another one starts from an older commit;
      # start from the latest main so the pipeline sees the newest frozen
      # recommendation (publish won't overwrite a final pre-deadline one).
      - name: Sync to the latest main
        run: |
          git fetch --depth=1 origin main
          git reset --hard FETCH_HEAD

      - uses: astral-sh/setup-uv@v10.3.3  # setup-uv publishes no moving major tag

      - name: Run the pipeline (fetch -> external data -> features -> model -> league -> scoring -> optimise -> simulation -> publish -> consistency check)
        run: uv run python -m fpl.pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      # Commits the data files, then pull --rebase + push with up to 3
      # attempts -- a run queued behind another one starts from an outdated
      # checkout, so a plain push was rejected. Exits 0 when there's nothing
      # to commit, so Pages still deploys. See the script for details.
      # continue-on-error: the freshly built site still deploys if saving the
      # data fails after its retries; the last step below then marks the run
      # failed so it doesn't go unnoticed. (If the pipeline step above fails,
      # every later step -- including the deploy -- is skipped as usual.)
      - name: Save the prediction log, accuracy track record and source fallbacks
        id: save
        continue-on-error: true
        run: bash .github/scripts/save_bot_data.sh

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Fail the run if the data save failed (site was still deployed)
        if: steps.save.outcome == 'failure'
        run: |
          echo "::error::Saving the data to the repo failed after its retries -- see the save step's log. The site itself was deployed."
          exit 1
